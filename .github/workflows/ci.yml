name: CI

on:
  push:
    branches:
      - local
  pull_request:
    branches:
      - local

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: gestion_presence
          MYSQL_USER: gp_user
          MYSQL_PASSWORD: gp_password
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            mysql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -prootpassword && break
            sleep 2
          done

      - name: Prepare database schema
        working-directory: backend
        run: |
          python - <<'PY'
          import app.db.base  # noqa: F401
          from app.db.session import Base, engine
          Base.metadata.create_all(bind=engine)
          PY

      - name: Run backend tests
        working-directory: backend
        run: pytest app/Test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
